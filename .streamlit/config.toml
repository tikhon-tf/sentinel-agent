[theme]
# Nebius design system colors (from forge.eu-north1.osmo.nebius.cloud)
base = "dark"
primaryColor = "#DAFF33"            # nebius-lime — signature accent
backgroundColor = "#021621"         # primary dark navy
secondaryBackgroundColor = "#052B42" # elevated surfaces (cards, sidebar, expanders)
textColor = "#F0F8FF"               # nebius-light-blue (off-white)
font = "sans serif"

[server]
headless = true
